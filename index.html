<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Mobile3 Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* 라이트 모드 */
  :root {
    --glass-bg:          #ffffff;
    --glass-bg-hover:    #f5f5f5;
    --glass-border:      rgba(0, 0, 0, 0.12);
    --glass-border-hover:rgba(0, 0, 0, 0.24);
    --text-primary:      rgba(0, 0, 0, 0.88);
    --text-secondary:    rgba(0, 0, 0, 0.50);
    --text-tertiary:     rgba(0, 0, 0, 0.30);
    --hero-gradient:     linear-gradient(180deg, #111 0%, rgba(0,0,0,0.50) 100%);
    --glow-opacity:      0.30;
  }

  /* 다크 모드 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:                #191919;
      --glass-bg:          rgba(255, 255, 255, 0.06);
      --glass-bg-hover:    rgba(255, 255, 255, 0.09);
      --glass-border:      rgba(255, 255, 255, 0.11);
      --glass-border-hover:rgba(255, 255, 255, 0.22);
      --text-primary:      rgba(255, 255, 255, 0.96);
      --text-secondary:    rgba(255, 255, 255, 0.58);
      --text-tertiary:     rgba(255, 255, 255, 0.34);
      --hero-gradient:     linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.60) 100%);
      --glow-opacity:      0.45;
    }
  }

  html, body {
    background: transparent;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }

  .container {
    width: 100%;
    padding: 12px 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ── 전체 과제 히어로 ── */
  .hero {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 18px 20px;
    overflow: hidden;
    opacity: 0;
    animation: card-in 0.7s 0.05s cubic-bezier(0.16,1,0.3,1) forwards;
    text-decoration: none; color: inherit; display: block;
    transition: border-color 0.2s, background 0.2s;
  }
  .hero:active { opacity: 0.8; }
  @media (hover: hover) {
    .hero:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,120,50,0.08) 0%, transparent 55%);
    pointer-events: none;
  }
  .hero-glow {
    position: absolute; top: -40%; right: -10%;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,35,0.30), transparent 65%);
    filter: blur(32px); pointer-events: none;
  }
  /* 한화 Lifeplus 브랜드 로고 영역 */
  .hero-brand {
    position: absolute; top: 16px; right: 18px;
    display: flex; align-items: center; gap: 5px;
    opacity: 0.55;
  }
  .hero-brand-icon {
    width: 28px; height: 28px;
  }
  .hero-brand-text {
    font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--text-secondary); line-height: 1.2;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .hero-number { display: flex; align-items: baseline; gap: 7px; }
  .hero-value {
    font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
    background: var(--hero-gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-feature-settings: 'tnum' 1;
  }
  .hero-unit { font-size: 13px; color: var(--text-tertiary); }

  /* ── 2×2 그리드 ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-card {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px 12px;
    overflow: hidden;
    opacity: 0;
    text-decoration: none; color: inherit;
    transition: border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-card:active { opacity: 0.8; }
  @media (hover: hover) {
    .stat-card:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .stat-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .stat-card:nth-child(1) { animation: card-in 0.7s 0.12s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(2) { animation: card-in 0.7s 0.19s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(3) { animation: card-in 0.7s 0.26s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(4) { animation: card-in 0.7s 0.33s cubic-bezier(0.16,1,0.3,1) forwards; }

  .stat-glow {
    position: absolute; bottom: -30px; right: -20px;
    width: 100px; height: 100px; border-radius: 50%;
    filter: blur(24px); pointer-events: none; opacity: var(--glow-opacity);
  }
  .glow-blue  { background: radial-gradient(circle, #3b82f6, transparent 70%); }
  .glow-amber { background: radial-gradient(circle, #f59e0b, transparent 70%); }
  .glow-green { background: radial-gradient(circle, #10b981, transparent 70%); }
  .glow-red   { background: radial-gradient(circle, #ef4444, transparent 70%); }

  .stat-label {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
  }
  .stat-icon { flex-shrink: 0; }
  .icon-blue  { color: #3b82f6; filter: drop-shadow(0 0 3px #3b82f688); }
  .icon-amber { color: #f59e0b; filter: drop-shadow(0 0 3px #f59e0b88); }
  .icon-green { color: #10b981; filter: drop-shadow(0 0 3px #10b98188); }
  .icon-red   { color: #ef4444; filter: drop-shadow(0 0 3px #ef444488); }

  .stat-value {
    position: relative; z-index: 1;
    font-size: 36px; font-weight: 700; line-height: 1;
    letter-spacing: -0.03em; color: var(--text-primary);
    font-feature-settings: 'tnum' 1;
  }

  .loading-text { color: var(--text-tertiary); font-size: 20px; }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <a class="hero" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=337056cc7000803f99ad000c968ac036" target="_top">
      <div class="hero-glow"></div>

      <!-- 한화 Lifeplus 브랜드 마크 -->
      <div class="hero-brand">
        <svg class="hero-brand-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- 태양 광선 8개 -->
          <g stroke="#FF6B23" stroke-width="2.2" stroke-linecap="round">
            <line x1="20" y1="3"  x2="20" y2="9"/>
            <line x1="20" y1="31" x2="20" y2="37"/>
            <line x1="3"  y1="20" x2="9"  y2="20"/>
            <line x1="31" y1="20" x2="37" y2="20"/>
            <line x1="7.5"  y1="7.5"  x2="11.7" y2="11.7"/>
            <line x1="28.3" y1="28.3" x2="32.5" y2="32.5"/>
            <line x1="7.5"  y1="32.5" x2="11.7" y2="28.3"/>
            <line x1="28.3" y1="11.7" x2="32.5" y2="7.5"/>
          </g>
          <!-- 중앙 원 -->
          <circle cx="20" cy="20" r="7" fill="#FF6B23"/>
          <!-- 불꽃 심볼 -->
          <path d="M20 14.5c0 0 3.5 3 2.5 6-0.5 1.5-2.5 2.5-2.5 2.5s-2-1-2.5-2.5c-1-3 2.5-6 2.5-6z" fill="white" opacity="0.9"/>
        </svg>
        <div class="hero-brand-text">HANWHA<br>LIFEPLUS</div>
      </div>

      <div class="hero-content">
        <div class="hero-label">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#FF6B23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          <span>전체 과제 · Total</span>
        </div>
        <div class="hero-number">
          <span class="hero-value" id="totalValue"><span class="loading-text">…</span></span>
          <span class="hero-unit">건</span>
        </div>
      </div>
    </a>

    <div class="stats-grid">
      <a class="stat-card" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=39746c3a08b94c6bbba5d08438a680ae" target="_top">
        <div class="stat-glow glow-blue"></div>
        <div class="stat-label">
          <svg class="stat-icon icon-blue" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
          진행 중
        </div>
        <div class="stat-value" id="inProgressValue"><span class="loading-text">…</span></div>
      </a>
      <a class="stat-card" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=48f8c810faed454b86bd858239c331d1" target="_top">
        <div class="stat-glow glow-amber"></div>
        <div class="stat-label">
          <svg class="stat-icon icon-amber" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
          보류
        </div>
        <div class="stat-value" id="holdValue"><span class="loading-text">…</span></div>
      </a>
      <a class="stat-card" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=c0eca2b7ebcd47179b740c7499a1a9b6" target="_top">
        <div class="stat-glow glow-green"></div>
        <div class="stat-label">
          <svg class="stat-icon icon-green" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
          완료
        </div>
        <div class="stat-value" id="doneValue"><span class="loading-text">…</span></div>
      </a>
      <a class="stat-card" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=fc272ce609ae4a7fb791fda70fbb3d87" target="_top">
        <div class="stat-glow glow-red"></div>
        <div class="stat-label">
          <svg class="stat-icon icon-red" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,6 5,6 21,6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          삭제
        </div>
        <div class="stat-value" id="deleteValue"><span class="loading-text">…</span></div>
      </a>
    </div>
  </div>

<script>
  var STATS = {total:97,inProgress:15,hold:3,done:4,deleted:3}; // @@STATS@@

  function animateCount(el, target, delay) {
    setTimeout(() => {
      el.innerHTML = '';
      const duration = 2500;
      const start = performance.now();
      (function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 2.5)));
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      })(start);
    }, delay);
  }

  function loadStats() {
    var d = STATS;
    animateCount(document.getElementById('totalValue'),      d.total,      300);
    animateCount(document.getElementById('inProgressValue'), d.inProgress, 400);
    animateCount(document.getElementById('holdValue'),       d.hold,       500);
    animateCount(document.getElementById('doneValue'),       d.done,       600);
    animateCount(document.getElementById('deleteValue'),     d.deleted,    700);
  }

  addEventListener('DOMContentLoaded', loadStats);
</script>
</body>
</html>
