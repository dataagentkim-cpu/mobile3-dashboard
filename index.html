<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0a0a14" />
<title>Mobile3 Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-deep: #0a0a14;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-bg-hover: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.10);
    --glass-border-hover: rgba(255, 255, 255, 0.20);
    --text-primary: rgba(255, 255, 255, 0.96);
    --text-secondary: rgba(255, 255, 255, 0.60);
    --text-tertiary: rgba(255, 255, 255, 0.36);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  html, body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    letter-spacing: -0.011em;
    text-rendering: optimizeLegibility;
  }

  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(at 15% 15%, #6366f1 0px, transparent 45%),
      radial-gradient(at 85% 5%, #8b5cf6 0px, transparent 50%),
      radial-gradient(at 90% 75%, #ec4899 0px, transparent 45%),
      radial-gradient(at 10% 85%, #06b6d4 0px, transparent 45%);
    filter: saturate(1.15) brightness(0.65);
    transform: translateZ(0);
    will-change: transform;
  }

  @media (min-width: 768px) and (prefers-reduced-motion: no-preference) {
    .bg-gradient { animation: gradient-shift 24s ease-in-out infinite; }
    @keyframes gradient-shift {
      0%, 100% { transform: scale(1) rotate(0deg) translateZ(0); }
      50% { transform: scale(1.05) rotate(1deg) translateZ(0); }
    }
  }

  .bg-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at top, transparent 0%, var(--bg-deep) 75%);
    pointer-events: none;
  }

  .bg-grain {
    position: fixed; inset: 0; z-index: 2;
    opacity: 0.025; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode: overlay;
  }

  .container {
    position: relative; z-index: 10;
    width: 100%; max-width: 460px; margin: 0 auto;
    padding:
      max(20px, var(--safe-top))
      max(14px, var(--safe-right))
      max(28px, var(--safe-bottom))
      max(14px, var(--safe-left));
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 0 4px;
    opacity: 0; animation: fade-in 0.7s 0.05s forwards;
  }

  .header-title {
    font-size: 10.5px; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.16em; color: var(--text-tertiary);
  }

  .header-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 10.5px; color: var(--text-secondary);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-weight: 500;
    letter-spacing: 0.05em;
  }

  .status-dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #10b981;
    box-shadow: 0 0 6px #10b981, 0 0 12px rgba(16, 185, 129, 0.5);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.55; transform: scale(0.85); }
  }

  .hero {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(1.7);
    -webkit-backdrop-filter: blur(28px) saturate(1.7);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    padding: 22px 20px;
    margin-bottom: 10px;
    overflow: hidden;
    opacity: 0;
    animation: card-in 0.85s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, background 0.25s;
    text-decoration: none; color: inherit; display: block;
  }

  @media (hover: hover) {
    .hero:hover { transform: translateY(-2px); border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .hero:active { transform: scale(0.99); }

  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.07) 0%, transparent 55%);
    pointer-events: none;
  }

  .hero-glow {
    position: absolute; top: -30%; right: -15%;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 92, 246, 0.45), transparent 65%);
    filter: blur(35px); pointer-events: none;
  }

  .hero-content { position: relative; z-index: 1; }

  .hero-label {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 10px;
  }

  .hero-icon { display: inline-flex; align-items: center; color: var(--text-secondary); }

  .hero-number { display: flex; align-items: baseline; gap: 8px; }

  .hero-value {
    font-size: clamp(48px, 14vw, 60px);
    font-weight: 700; line-height: 0.95; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.62) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-feature-settings: 'tnum' 1;
  }

  .hero-unit { font-size: 13px; color: var(--text-tertiary); font-weight: 400; }

  .hero-meta {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; font-size: 10px; color: var(--text-tertiary);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.04em;
  }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }

  .stat-card {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 14px 14px 12px;
    overflow: hidden;
    opacity: 0;
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s, background 0.25s;
    text-decoration: none; color: inherit;
    min-height: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }

  @media (hover: hover) {
    .stat-card:hover { transform: translateY(-2px); border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .stat-card:active { transform: scale(0.98); }

  .stat-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .stat-card:nth-child(1) { animation: card-in 0.85s 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .stat-card:nth-child(2) { animation: card-in 0.85s 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .stat-card:nth-child(3) { animation: card-in 0.85s 0.44s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  .stat-card:nth-child(4) { animation: card-in 0.85s 0.52s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  .stat-glow {
    position: absolute; bottom: -35px; right: -25px;
    width: 110px; height: 110px; border-radius: 50%;
    filter: blur(28px); pointer-events: none; opacity: 0.5;
  }
  .glow-blue  { background: radial-gradient(circle, #3b82f6, transparent 70%); }
  .glow-amber { background: radial-gradient(circle, #f59e0b, transparent 70%); }
  .glow-green { background: radial-gradient(circle, #10b981, transparent 70%); }
  .glow-slate { background: radial-gradient(circle, #94a3b8, transparent 70%); }

  .stat-content {
    position: relative; z-index: 1; flex: 1;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .stat-top { display: flex; flex-direction: column; gap: 8px; }

  .stat-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
  }

  .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-blue  { background: #3b82f6; box-shadow: 0 0 5px #3b82f6; }
  .dot-amber { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }
  .dot-green { background: #10b981; box-shadow: 0 0 5px #10b981; }
  .dot-slate { background: #94a3b8; box-shadow: 0 0 5px #94a3b8; }

  .stat-value {
    font-size: clamp(28px, 8.5vw, 34px);
    font-weight: 700; line-height: 0.95;
    letter-spacing: -0.03em; color: var(--text-primary);
    font-feature-settings: 'tnum' 1;
  }

  .stat-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; font-size: 9.5px; color: var(--text-tertiary);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.05em;
  }

  .stat-arrow { font-size: 11px; transition: transform 0.25s; }
  .stat-card:active .stat-arrow { transform: translateX(2px); }

  .footer {
    margin-top: 14px; text-align: center;
    font-size: 9.5px; color: var(--text-tertiary);
    font-family: ui-monospace, 'SF Mono', Menlo, monospace; letter-spacing: 0.06em;
    opacity: 0; animation: fade-in 0.7s 0.65s forwards;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  @media (max-width: 360px) {
    .container { padding-left: 12px; padding-right: 12px; }
    .hero { padding: 18px 16px; }
    .stat-card { padding: 12px 12px 10px; min-height: 88px; }
    .stats-grid { gap: 7px; }
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-overlay"></div>
  <div class="bg-grain"></div>

  <div class="container">
    <div class="header">
      <div class="header-title">MOBILE3 · TASK BOARD</div>
      <div class="header-status">
        <span class="status-dot"></span>
        <span>NOTION</span>
      </div>
    </div>

    <a class="hero" href="https://www.notion.so/35a056cc7000812fa6d7c10bbaa60945" target="_blank" rel="noopener">
      <div class="hero-glow"></div>
      <div class="hero-content">
        <div class="hero-label">
          <span class="hero-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M3 9.5L12 4l9 5.5"/><path d="M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>
          </span>
          <span>전체 과제 · Total</span>
        </div>
        <div class="hero-number">
          <span class="hero-value" id="totalValue">97</span>
          <span class="hero-unit">건</span>
        </div>
        <div class="hero-meta">
          <span id="lastUpdated">UPDATED <span id="updatedTime"></span></span>
        </div>
      </div>
    </a>

    <div class="stats-grid">
      <a class="stat-card" href="https://www.notion.so/35a056cc7000812b85c0fd61d3e40a5d" target="_blank" rel="noopener">
        <div class="stat-glow glow-blue"></div>
        <div class="stat-content">
          <div class="stat-top">
            <div class="stat-label"><span class="stat-dot dot-blue"></span><span>진행 중</span></div>
            <div class="stat-value" id="inProgressValue">15</div>
          </div>
          <div class="stat-meta"><span>IN PROGRESS</span><span class="stat-arrow">→</span></div>
        </div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc700081309c8ef8844b5bf38c" target="_blank" rel="noopener">
        <div class="stat-glow glow-amber"></div>
        <div class="stat-content">
          <div class="stat-top">
            <div class="stat-label"><span class="stat-dot dot-amber"></span><span>보류</span></div>
            <div class="stat-value" id="holdValue">3</div>
          </div>
          <div class="stat-meta"><span>ON HOLD</span><span class="stat-arrow">→</span></div>
        </div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc7000814eb001e0e84129d32b" target="_blank" rel="noopener">
        <div class="stat-glow glow-green"></div>
        <div class="stat-content">
          <div class="stat-top">
            <div class="stat-label"><span class="stat-dot dot-green"></span><span>완료</span></div>
            <div class="stat-value" id="doneValue">4</div>
          </div>
          <div class="stat-meta"><span>COMPLETED</span><span class="stat-arrow">→</span></div>
        </div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc7000812fa6d7c10bbaa60945" target="_blank" rel="noopener">
        <div class="stat-glow glow-slate"></div>
        <div class="stat-content">
          <div class="stat-top">
            <div class="stat-label"><span class="stat-dot dot-slate"></span><span>대기 / 기타</span></div>
            <div class="stat-value" id="pendingValue">75</div>
          </div>
          <div class="stat-meta"><span>BACKLOG</span><span class="stat-arrow">→</span></div>
        </div>
      </a>
    </div>

    <div class="footer" id="footerText">SYNCED FROM NOTION · MOBILE3</div>
  </div>

<script>
  function animateCount(el, target, delay = 0) {
    setTimeout(() => {
      const duration = 1100;
      const startTime = performance.now();
      const start = 0;
      const diff = target - start;
      function update(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(start + diff * eased);
        if (progress < 1) requestAnimationFrame(update);
        else el.textContent = target;
      }
      requestAnimationFrame(update);
    }, delay);
  }

  function formatTime(date) {
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    return `${h}:${m}`;
  }

  const DATA = { total: 97, inProgress: 15, hold: 3, done: 4, pending: 75 };

  window.addEventListener('DOMContentLoaded', () => {
    document.getElementById('updatedTime').textContent = formatTime(new Date());

    setTimeout(() => {
      animateCount(document.getElementById('totalValue'),      DATA.total,      0);
      animateCount(document.getElementById('inProgressValue'), DATA.inProgress, 70);
      animateCount(document.getElementById('holdValue'),       DATA.hold,       140);
      animateCount(document.getElementById('doneValue'),       DATA.done,       210);
      animateCount(document.getElementById('pendingValue'),    DATA.pending,    280);
    }, 600);
  });
</script>
</body>
</html>
