<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="theme-color" content="#0a0a14" />
<title>Mobile3 Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep: #0a0a14;
    --glass-bg: rgba(255,255,255,0.06);
    --glass-bg-hover: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.11);
    --glass-border-hover: rgba(255,255,255,0.22);
    --text-primary: rgba(255,255,255,0.96);
    --text-secondary: rgba(255,255,255,0.58);
    --text-tertiary: rgba(255,255,255,0.34);
  }

  html, body {
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }

  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(at 15% 15%, #6366f1 0px, transparent 45%),
      radial-gradient(at 85% 5%,  #8b5cf6 0px, transparent 50%),
      radial-gradient(at 90% 75%, #ec4899 0px, transparent 45%),
      radial-gradient(at 10% 85%, #06b6d4 0px, transparent 45%);
    filter: saturate(1.15) brightness(0.65);
  }

  .bg-overlay {
    position: fixed; inset: 0; z-index: 1;
    background: radial-gradient(ellipse at top, transparent 0%, var(--bg-deep) 75%);
    pointer-events: none;
  }

  .container {
    position: relative; z-index: 10;
    width: 100%;
    padding: 12px 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* 전체 과제 */
  .hero {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 16px 18px;
    overflow: hidden;
    opacity: 0;
    animation: card-in 0.7s 0.05s cubic-bezier(0.16,1,0.3,1) forwards;
    text-decoration: none; color: inherit; display: block;
    transition: border-color 0.2s, background 0.2s;
  }
  .hero:active { opacity: 0.85; }
  @media (hover: hover) {
    .hero:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }

  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.07) 0%, transparent 55%);
    pointer-events: none;
  }

  .hero-glow {
    position: absolute; top: -40%; right: -10%;
    width: 180px; height: 180px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.4), transparent 65%);
    filter: blur(30px); pointer-events: none;
  }

  .hero-content { position: relative; z-index: 1; }

  .hero-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px;
  }

  .hero-number { display: flex; align-items: baseline; gap: 7px; }

  .hero-value {
    font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
    background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.6) 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-feature-settings: 'tnum' 1;
  }

  .hero-unit { font-size: 13px; color: var(--text-tertiary); }

  /* 2×2 그리드 */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-card {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 13px 14px 11px;
    overflow: hidden;
    opacity: 0;
    text-decoration: none; color: inherit;
    transition: border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-card:active { opacity: 0.8; }
  @media (hover: hover) {
    .stat-card:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }

  .stat-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .stat-card:nth-child(1) { animation: card-in 0.7s 0.12s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(2) { animation: card-in 0.7s 0.18s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(3) { animation: card-in 0.7s 0.24s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(4) { animation: card-in 0.7s 0.30s cubic-bezier(0.16,1,0.3,1) forwards; }

  .stat-glow {
    position: absolute; bottom: -30px; right: -20px;
    width: 90px; height: 90px; border-radius: 50%;
    filter: blur(22px); pointer-events: none; opacity: 0.45;
  }
  .glow-blue  { background: radial-gradient(circle, #3b82f6, transparent 70%); }
  .glow-amber { background: radial-gradient(circle, #f59e0b, transparent 70%); }
  .glow-green { background: radial-gradient(circle, #10b981, transparent 70%); }
  .glow-slate { background: radial-gradient(circle, #94a3b8, transparent 70%); }

  .stat-label {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
  }

  .stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .dot-blue  { background: #3b82f6; box-shadow: 0 0 5px #3b82f6; }
  .dot-amber { background: #f59e0b; box-shadow: 0 0 5px #f59e0b; }
  .dot-green { background: #10b981; box-shadow: 0 0 5px #10b981; }
  .dot-slate { background: #94a3b8; box-shadow: 0 0 5px #94a3b8; }

  .stat-value {
    position: relative; z-index: 1;
    font-size: 34px; font-weight: 700; line-height: 1;
    letter-spacing: -0.03em; color: var(--text-primary);
    font-feature-settings: 'tnum' 1;
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-overlay"></div>

  <div class="container">
    <a class="hero" href="https://www.notion.so/35a056cc7000812fa6d7c10bbaa60945" target="_blank" rel="noopener">
      <div class="hero-glow"></div>
      <div class="hero-content">
        <div class="hero-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="13" height="13"><path d="M3 9.5L12 4l9 5.5"/><path d="M5 10v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>
          <span>전체 과제 · Total</span>
        </div>
        <div class="hero-number">
          <span class="hero-value" id="totalValue">97</span>
          <span class="hero-unit">건</span>
        </div>
      </div>
    </a>

    <div class="stats-grid">
      <a class="stat-card" href="https://www.notion.so/35a056cc7000812b85c0fd61d3e40a5d" target="_blank" rel="noopener">
        <div class="stat-glow glow-blue"></div>
        <div class="stat-label"><span class="stat-dot dot-blue"></span>진행 중</div>
        <div class="stat-value" id="inProgressValue">15</div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc700081309c8ef8844b5bf38c" target="_blank" rel="noopener">
        <div class="stat-glow glow-amber"></div>
        <div class="stat-label"><span class="stat-dot dot-amber"></span>보류</div>
        <div class="stat-value" id="holdValue">3</div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc7000814eb001e0e84129d32b" target="_blank" rel="noopener">
        <div class="stat-glow glow-green"></div>
        <div class="stat-label"><span class="stat-dot dot-green"></span>완료</div>
        <div class="stat-value" id="doneValue">4</div>
      </a>

      <a class="stat-card" href="https://www.notion.so/35a056cc7000812fa6d7c10bbaa60945" target="_blank" rel="noopener">
        <div class="stat-glow glow-slate"></div>
        <div class="stat-label"><span class="stat-dot dot-slate"></span>대기 / 기타</div>
        <div class="stat-value" id="pendingValue">75</div>
      </a>
    </div>
  </div>

<script>
  function animateCount(el, target, delay) {
    setTimeout(() => {
      const duration = 900, start = performance.now();
      (function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      })(start);
    }, delay);
  }

  const D = { total: 97, inProgress: 15, hold: 3, done: 4, pending: 75 };
  addEventListener('DOMContentLoaded', () => {
    animateCount(document.getElementById('totalValue'),      D.total,      300);
    animateCount(document.getElementById('inProgressValue'), D.inProgress, 370);
    animateCount(document.getElementById('holdValue'),       D.hold,       440);
    animateCount(document.getElementById('doneValue'),       D.done,       510);
    animateCount(document.getElementById('pendingValue'),    D.pending,    580);
  });
</script>
</body>
</html>
