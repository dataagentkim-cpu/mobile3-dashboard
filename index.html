<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<meta name="color-scheme" content="light dark" />
<title>Mobile3 Dashboard</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* 라이트 모드 */
  :root {
    --glass-bg:          #ffffff;
    --glass-bg-hover:    #f5f5f5;
    --glass-border:      rgba(0, 0, 0, 0.12);
    --glass-border-hover:rgba(0, 0, 0, 0.24);
    --text-primary:      rgba(0, 0, 0, 0.88);
    --text-secondary:    rgba(0, 0, 0, 0.50);
    --text-tertiary:     rgba(0, 0, 0, 0.30);
    --hero-gradient:     linear-gradient(180deg, #111 0%, rgba(0,0,0,0.50) 100%);
    --glow-opacity:      0.30;
  }

  /* 다크 모드 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:                #191919;
      --glass-bg:          rgba(255, 255, 255, 0.06);
      --glass-bg-hover:    rgba(255, 255, 255, 0.09);
      --glass-border:      rgba(255, 255, 255, 0.11);
      --glass-border-hover:rgba(255, 255, 255, 0.22);
      --text-primary:      rgba(255, 255, 255, 0.96);
      --text-secondary:    rgba(255, 255, 255, 0.58);
      --text-tertiary:     rgba(255, 255, 255, 0.34);
      --hero-gradient:     linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.60) 100%);
      --glow-opacity:      0.45;
    }
  }

  html, body {
    background: transparent;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.011em;
  }

  .container {
    width: 100%;
    padding: 12px 12px 14px;
    display: flex; flex-direction: column; gap: 8px;
  }

  /* ── 전체 과제 히어로 ── */
  .hero {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    padding: 18px 20px;
    overflow: hidden;
    opacity: 0;
    animation: card-in 0.7s 0.05s cubic-bezier(0.16,1,0.3,1) forwards;
    text-decoration: none; color: inherit; display: block;
    transition: border-color 0.2s, background 0.2s;
  }
  .hero:active { opacity: 0.8; }
  @media (hover: hover) {
    .hero:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,120,50,0.08) 0%, transparent 55%);
    pointer-events: none;
  }
  .hero-glow {
    position: absolute; top: -40%; right: -10%;
    width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,107,35,0.30), transparent 65%);
    filter: blur(32px); pointer-events: none;
  }
  /* 한화 Lifeplus 브랜드 로고 영역 */
  .hero-brand {
    position: absolute; top: 16px; right: 18px;
    opacity: 0.50;
  }
  .hero-brand-logo {
    display: block;
    fill: var(--text-primary);
    width: 80px; height: auto;
  }
  .hero-content { position: relative; z-index: 1; }
  .hero-label {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .hero-number { display: flex; align-items: baseline; gap: 7px; }
  .hero-value {
    font-size: 52px; font-weight: 700; line-height: 1; letter-spacing: -0.04em;
    background: var(--hero-gradient);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    font-feature-settings: 'tnum' 1;
  }
  .hero-unit { font-size: 13px; color: var(--text-tertiary); }

  /* ── 2×2 그리드 ── */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-card {
    position: relative;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 14px 16px 12px;
    overflow: hidden;
    opacity: 0;
    text-decoration: none; color: inherit;
    transition: border-color 0.2s, background 0.2s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .stat-card:active { opacity: 0.8; }
  @media (hover: hover) {
    .stat-card:hover { border-color: var(--glass-border-hover); background: var(--glass-bg-hover); }
  }
  .stat-card::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 50%);
    pointer-events: none;
  }

  .stat-card:nth-child(1) { animation: card-in 0.7s 0.12s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(2) { animation: card-in 0.7s 0.19s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(3) { animation: card-in 0.7s 0.26s cubic-bezier(0.16,1,0.3,1) forwards; }
  .stat-card:nth-child(4) { animation: card-in 0.7s 0.33s cubic-bezier(0.16,1,0.3,1) forwards; }

  .stat-glow {
    position: absolute; bottom: -30px; right: -20px;
    width: 100px; height: 100px; border-radius: 50%;
    filter: blur(24px); pointer-events: none; opacity: var(--glow-opacity);
  }
  .glow-blue  { background: radial-gradient(circle, #3b82f6, transparent 70%); }
  .glow-amber { background: radial-gradient(circle, #f59e0b, transparent 70%); }
  .glow-green { background: radial-gradient(circle, #10b981, transparent 70%); }
  .glow-red   { background: radial-gradient(circle, #ef4444, transparent 70%); }

  .stat-label {
    position: relative; z-index: 1;
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 500; color: var(--text-secondary);
  }
  .stat-icon { flex-shrink: 0; }
  .icon-blue  { color: #3b82f6; filter: drop-shadow(0 0 3px #3b82f688); }
  .icon-amber { color: #f59e0b; filter: drop-shadow(0 0 3px #f59e0b88); }
  .icon-green { color: #10b981; filter: drop-shadow(0 0 3px #10b98188); }
  .icon-red   { color: #ef4444; filter: drop-shadow(0 0 3px #ef444488); }

  .stat-value {
    position: relative; z-index: 1;
    font-size: 36px; font-weight: 700; line-height: 1;
    letter-spacing: -0.03em; color: var(--text-primary);
    font-feature-settings: 'tnum' 1;
  }

  .loading-text { color: var(--text-tertiary); font-size: 20px; }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0)   scale(1);    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
  <div class="container">
    <a class="hero" href="https://www.notion.so/116296d07fca40fa978d5cc2a3c78eb0?v=337056cc7000803f99ad000c968ac036" target="_top">
      <div class="hero-glow"></div>

      <!-- 한화 Lifeplus 공식 로고 (lifeplus.co.kr) -->
      <div class="hero-brand">
        <svg class="hero-brand-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 101 26"><path d="M55,20.58a1.73,1.73,0,0,1-1.3.51h-2V17.68h2a2,2,0,0,1,1.4.5,1.66,1.66,0,0,1,.51,1.2,1.43,1.43,0,0,1-.61,1.2m-5.5-5V25.5h2.2V23.09h2.1A3.79,3.79,0,0,0,56.56,22a3.49,3.49,0,0,0,1.1-2.61,3.39,3.39,0,0,0-1.1-2.7,3.75,3.75,0,0,0-2.81-1.11ZM93.59.54v9.92H101V8.36H95.69V6.45H99.3V4.35H95.69V2.54h5.21v-2ZM72,23.49h-5.2V15.57H64.56v10H72ZM56.86,8.36H51.65V.54h-2.2v9.92h7.41ZM85.28,2.54v-2h-7.4v9.92h2.2V6.55h3.6V4.45h-3.6V2.54Zm-1.9,13v6.12a2,2,0,0,1-.5,1.4,1.69,1.69,0,0,1-2.4,0,1.73,1.73,0,0,1-.5-1.3V15.67h-2.2v6.12a3.76,3.76,0,0,0,1.1,2.8,3.84,3.84,0,0,0,5.4,0,3.76,3.76,0,0,0,1.1-2.8V15.67l-2-.1Zm17.12,8.52a3.16,3.16,0,0,0,.1-2.6,3.2,3.2,0,0,0-2.5-1.81c-1.8-.4-2.21-.6-2.21-1.2,0-.3.21-.8,1.41-.8a5.54,5.54,0,0,1,2.4.7l.6-2.11a6.32,6.32,0,0,0-2.8-.6,4,4,0,0,0-2.91.91,2.93,2.93,0,0,0,.6,4.51c1.21.6,3.61.7,3.51,1.7,0,.8-1,.9-1.6.9a6.06,6.06,0,0,1-2.91-.9l-.5,2a6,6,0,0,0,3.41.91c.1-.1,2.5,0,3.4-1.61M65.67.54h2.2v9.92h-2.2Zm-26.73,2a8.62,8.62,0,0,0-12.11-.1c-4.31,4.31-5.51,5.62-10,7.12A22.06,22.06,0,0,1,4.5,8.86a5.85,5.85,0,0,0-2.2-.5A2.24,2.24,0,0,0,0,10.56H0c0,1.31.7,1.81,2.3,3.11a47.53,47.53,0,0,1,8.51,8.82A8.38,8.38,0,0,0,17.42,26c4.3-.1,6-2.21,9.21-4.31,3.4-2.11,6-2.61,10.61-5.31C42,13.77,42.94,6.65,38.94,2.54Z"/></svg>

    <div class="stats-grid">

        <div class="stat-glow glow-blue"></div>

          <svg class="stat-icon icon-blue" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>

          <svg class="stat-icon icon-amber" viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>

        </div>

    </div>
  </div>

<script>
  var STATS = {total:97,inProgress:15,hold:3,done:4,deleted:3}; // @@STATS@@

  function animateCount(el, target, delay) {
    setTimeout(() => {
      el.innerHTML = '';
      const duration = 2500;
      const start = performance.now();
      (function tick(now) {
        const p = Math.min((now - start) / duration, 1);
        el.textContent = Math.floor(target * (1 - Math.pow(1 - p, 2.5)));
        if (p < 1) requestAnimationFrame(tick);
        else el.textContent = target;
      })(start);
    }, delay);
  }

  function loadStats() {
    var d = STATS;
    animateCount(document.getElementById('totalValue'),      d.total,      300);
    animateCount(document.getElementById('inProgressValue'), d.inProgress, 400);
    animateCount(document.getElementById('holdValue'),       d.hold,       500);
    animateCount(document.getElementById('doneValue'),       d.done,       600);
    animateCount(document.getElementById('deleteValue'),     d.deleted,    700);
  }

  function setupLinks() {
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!isMobile) {
      document.querySelectorAll('a[href]').forEach(function(a) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
      });
    }
  }

  addEventListener('DOMContentLoaded', function() { loadStats(); setupLinks(); });
</script>
